<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<header><strong>chimpread</strong><button id="settings">Settings</button></header>
<section><h2>Save this page</h2><input id="title" aria-label="Paper title" placeholder="Paper title"><select id="collection" aria-label="Collection"><option value="">Unfiled</option></select><div class="row"><button id="save">Save reference</button><button id="pdf" disabled>Save with PDF</button></div><small id="pageHint"></small></section>
<section><h2>Cite your library</h2><div class="row"><input id="query" placeholder="Title, author, DOI" aria-label="Search library"><button id="search">Search</button></div><div id="results"></div><small id="selection"></small><div class="row"><select id="style" aria-label="Citation style"><option>APA 7</option><option>Nature</option><option>BibTeX</option><option>CSL-JSON</option></select><button id="clear">Clear selection</button></div><div class="row"><button id="citation">Copy citation</button><button id="bibliography">Copy bibliography</button></div><textarea id="output" readonly aria-label="Citation preview" placeholder="Generated citation appears here"></textarea></section>
<section id="docs"><h2>Google Docs</h2><p>Insert plain-text citations or a bibliography into the current Google document.</p><div class="row"><select id="mode" aria-label="Insert type"><option value="citation">Replace marker</option><option value="bibliography">Append bibliography</option></select><input id="marker" value="{{cite}}" aria-label="Citation marker"></div><button id="preview">Preview insertion</button><div id="docPreview" hidden><strong id="docTitle"></strong><select id="docTab" aria-label="Document tab"></select><pre id="docText"></pre><button id="insert">Insert into this document</button><p>Inserted text is not a live citation field. Later library or style changes do not update it automatically.</p></div></section>
<p id="status" role="status"></p><script type="module" src="popup.js"></script></body></html>
